name: Build Browser

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "rc"
      - "hotfix-rc-*"
  pull_request:
    types: [opened, synchronize]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.browser.name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser:
          # Chrome and Firefox are both built as MV3. `dist:firefox` alone produces MV2, which
          # ships without the tracker-blocking declarativeNetRequest ruleset.
          - name: chrome-mv3
            npm_command: dist:chrome
            archive_name: dist-chrome.zip
          - name: firefox-mv3
            npm_command: dist:firefox:mv3
            archive_name: dist-firefox.zip
          - name: edge-mv3
            npm_command: dist:edge
            archive_name: dist-edge.zip

    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get Node Version
        id: retrieve-node-version
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build extension
        working-directory: apps/browser
        run: npm run ${{ matrix.browser.npm_command }}

      - name: Upload extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.browser.name }}
          path: apps/browser/dist/${{ matrix.browser.archive_name }}
          if-no-files-found: error

  # Firefox add-on review requires reviewable source for minified bundles.
  build-source:
    name: Build browser source for review
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # `git archive` reads the git index rather than walking the filesystem. `zip -r` cannot be
      # used here: third_party/arti/maint/rust-maint-common contains self-referential symlinks
      # (`common -> .`, `maint -> .`) that send it into infinite recursion.
      #
      # third_party/ is excluded: it is vendored reference material that nothing in the extension
      # build references (the SDK packages resolve from npm), and including it takes the archive
      # from 44 MB to 544 MB. What remains is the full source the build actually consumes —
      # apps/, libs/, package.json and package-lock.json.
      - name: Create source archive
        run: git archive --format=zip -o browser-source.zip HEAD -- ':(exclude)third_party'

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-source
          path: browser-source.zip
          if-no-files-found: error
