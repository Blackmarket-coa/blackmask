name: Mobile proof of concept

# Builds the Android proof of concept for the two-web-view shell and runs its device tests on an
# emulator. See apps/mobile-poc/README.md. Runs only when the proof of concept changes.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/mobile-poc/**"
      - ".github/workflows/mobile-poc.yml"
  push:
    branches:
      - "main"
    paths:
      - "apps/mobile-poc/**"
      - ".github/workflows/mobile-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile-poc/android

jobs:
  build:
    name: Build and unit-test the Android proof of concept
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build, unit-test and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug

  device-tests:
    name: Run the isolation tests on an Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The first run checks that the vault refuses to open on a device with no screen lock. The
      # second sets a PIN, which the other tests type into the system's unlock prompt.
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/mobile-poc/android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.blackmask.poc.NoScreenLockTest
            mkdir -p app/build/no-screen-lock && cp -r app/build/outputs/androidTest-results app/build/no-screen-lock/
            adb shell locksettings set-pin 1111
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=app.blackmask.poc.NoScreenLockTest

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mobile-poc-device-test-results
          path: |
            apps/mobile-poc/android/app/build/no-screen-lock
            apps/mobile-poc/android/app/build/outputs/androidTest-results
            apps/mobile-poc/android/app/build/reports/androidTests
          if-no-files-found: ignore
